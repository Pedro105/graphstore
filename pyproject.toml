[project]
name = "contextstore"
version = "0.1.0"
description = "GraphRAG-based memory layer for AI workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "falkordb>=1.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "instructor>=1.3",
    "anthropic>=0.34",
    "openai>=1.35",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "structlog>=24.1",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "mcp>=1.28.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "asyncpg>=0.29",
    "bcrypt>=4.1",
]

[project.scripts]
contextstore-mcp = "contextstore.mcp_server.server:main"

[dependency-groups]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contextstore"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "falkordb.*"
ignore_missing_imports = true

# asyncpg ships no type information (no py.typed), so treat it as untyped and
# opaque under --strict, same spirit as the falkordb override above.
[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
